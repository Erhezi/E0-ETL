# Central registry for every loader's INPUT files (the source side).
#
# Single source of truth for where each input file lives and how it arrives.
# Two consumers resolve from it, so they cannot drift:
#   * the loaders -- each `source.files` entry references an input by key
#     (`input: poline`) instead of restating its path/name; and
#   * `run_daily_loaders.py move-files` -- relocates each downloaded export to
#     its input's folder + canonical name before the loaders run.
# Filesystem only: nothing here reads file contents or touches a database.
#
# This file lives at the configs\ root (one level above the loader YAMLs in
# configs\loaders\) and is NOT a loader config -- `list`/`run` find it by
# looking in the configs directory and its parents (see infor_loader/cli.py).
#
#   python -B run_daily_loaders.py move-files --list       # show the download rules
#   python -B run_daily_loaders.py move-files --dry-run     # preview, touches nothing
#   python -B run_daily_loaders.py move-files               # dispatch every download
#   python -B run_daily_loaders.py move-files --tag mdm     # just the mdm exports
#   python -B run_daily_loaders.py move-files --check        # ...then verify every enabled
#                                                            # loader's source files resolve

# ---------------------------------------------------------------------------
# Named locations. THE batch-change knob: relocate a folder here and every
# loader + download rule that references it by name follows. Absolute paths
# live ONLY in this block.
# ---------------------------------------------------------------------------
folders:
  downloads:   'C:\Users\dli2\Downloads'
  temp_export: 'C:\Users\dli2\OneDrive - Montefiore Medicine\Documents\INFOR_SC\temp export'
  misc_mdm:    'C:\Users\dli2\OneDrive - Montefiore Medicine\Documents\INFOR_SC\misc mdm'

# Fallbacks every input's `download` block inherits unless it overrides them.
download_defaults:
  from: downloads      # where the browser drops the exports
  action: move         # Downloads is a chute, not a store -- the per-loader
                       # `archive` step keeps the consumed-input history.
  pick_latest: true    # newest match by mtime wins across re-download variants
  required: false      # nothing in Downloads only warns; the file already in
                       # the designated folder is still valid (guard: --check)
  on_exists: replace   # a fresh download replaces the file already in place

# ---------------------------------------------------------------------------
# One entry per physical input file: which folder it lives in, its canonical
# name, and -- for manual downloads -- the glob patterns to match. `patterns`
# lists the exact download name plus the browser's 're-download (N)' variant;
# whichever matches is renamed to `name`. Do NOT shorten a pair to a prefix
# glob like 'Item*.csv' -- it would also swallow ItemGTIN/ItemUOM/ItemReplenish.
#
# The two groups below are ORGANIZATIONAL only (a human troubleshooting aid):
# a direct-load problem -> go straight to the raw file; a staging->prod problem
# -> check the _stg table first, then the raw file. No behavior hangs on it.
# ---------------------------------------------------------------------------
inputs:

  # ==== transactional loaders (staging -> prod) : temp_export ==============
