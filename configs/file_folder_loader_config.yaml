    tags: [daily]
    download:
      patterns:
        - 'PurchaseOrderReceiptLine_DL+-+Export+To.csv'
        - 'PurchaseOrderReceiptLine_DL+-+Export+To (*).csv'

  purchaseorder_revision_issue_method:
    folder: temp_export
    name: 'PRD_DataTeam_PurchaseOrder_RevisionRel.csv'
    tags: [daily]
    download:
      patterns:
        - 'PRD_DataTeam_PurchaseOrder_RevisionRel.csv'
        - 'PRD_DataTeam_PurchaseOrder_RevisionRel (*).csv'

  requisition_line:
    folder: temp_export
    name: 'ReqLine.csv'
    tags: [daily]
    download:
      patterns:
        - 'ReqLine.csv'
        - 'ReqLine (*).csv'
        # Dated re-uploads used to fix a bad run (e.g. ReqLine_20260714.csv). The
        # [0-9] guard keeps this from also swallowing ReqLine_POUpdate.csv, which is
        # its own input below.
        - 'ReqLine_[0-9]*.csv'

  # Second daily requisition-line export: a PO-refresh feed (one row per line whose
  # sourced PO changed, keyed on the PO update stamp). Loaded into the aux staging
  # table requisition_line_po_update_stg, which the Step-2 PO-source merge reads.
  # Same loader (requisition_line), so it shares temp_export.
  requisition_line_po_update:
    folder: temp_export
    name: 'ReqLine_POUpdate.csv'
    tags: [daily]
    download:
      patterns:
        - 'ReqLine_POUpdate.csv'
        - 'ReqLine_POUpdate (*).csv'

  # ---- purchaseorder_line mapping side files : misc_mdm -------------------
  # company_map is a FIXTURE (maintained in place, no download) -- it still
  # lives here so its folder is centralized with everything else.
  company_map:
    folder: misc_mdm
    name: 'company_map.csv'

  fd3:
    folder: misc_mdm
    name: 'FD3.csv'
    tags: [daily]
    download:
      patterns:
        - 'FD3.csv'
        - 'FD3 (*).csv'

  fd5:
    folder: misc_mdm
    name: 'FD5.csv'
    tags: [daily]
    download:
      patterns:
        - 'FD5.csv'
        - 'FD5 (*).csv'

  # ---- App Preprocessor staging export : misc_mdm ------------------------
  # contract_line_error is TRANSACTIONAL (staging->prod), unlike the direct-load
  # mdm exports below: it loads a _stg table that the Preprocessor batch promotes.
  # It shares the misc mdm folder because it supports the App Preprocessor and is
  # operated with the other Preprocessor loaders (all tagged 'Preprocessor').
  contract_line_error:
    folder: misc_mdm
    name: 'ContractLineError.csv'
    tags: [daily]
    download:
      patterns:
        - 'ContractLineError.csv'
        - 'ContractLineError (*).csv'

  # ---- Baxter emergency item audit (staging -> prod) : baxter_emergency ---
  # ItemAudit_BaxterItem_All is the full Baxter item-audit export; the
  # baxter_emergency_item loader lands it in baxter_item_audit_stg and the
  # UpdateBaxterItemAudit proc upserts it into BAXTER_ITEM_AUDIT (des1 only).
  baxter_emergency_item:
    folder: baxter_emergency
    name: 'ItemAudit_BaxterItem_All.csv'
    tags: [daily]
    download:
      patterns:
        - 'ItemAudit_BaxterItem_All.csv'
        - 'ItemAudit_BaxterItem_All (*).csv'

  # ==== direct-load loaders (mdm, no staging) : misc_mdm ===================
  commodity_gl:
    folder: misc_mdm
    name: 'CommodityCodeGL.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'CommodityCodeGL.csv'
        - 'CommodityCodeGL (*).csv'

  edi_sub_uom:
    folder: misc_mdm
    name: 'EDI+sub.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'EDI+sub.csv'
        - 'EDI+sub (*).csv'

  item:
    folder: misc_mdm
    name: 'Item.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'Item.csv'
        - 'Item (*).csv'

  item_gtin:
    folder: misc_mdm
    name: 'ItemGTIN.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'ItemGTIN.csv'
        - 'ItemGTIN (*).csv'

  item_replenish_from:
    folder: misc_mdm
    name: 'ItemReplenishFrom.csv'
    tags: [daily, mdm]
    download:
      patterns:
