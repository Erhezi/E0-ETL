        - 'ItemUOM (*).csv'

  par_item_bin:
    folder: misc_mdm
    name: 'Par+Items+DL.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'Par+Items+DL.csv'
        - 'Par+Items+DL (*).csv'

  manufacturer:
    folder: misc_mdm
    name: 'Manufacturers.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'Manufacturers.csv'
        - 'Manufacturers (*).csv'

  requesting_location:
    folder: misc_mdm
    name: 'requesting+location.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'requesting+location.csv'
        - 'requesting+location (*).csv'

  # Saved-search export literally named 'copy of requester' (the '+' are the
  # export's URL-encoded spaces); consumed by the requester loader.
  requester:
    folder: misc_mdm
    name: 'copy+of+requester.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'copy+of+requester.csv'
        - 'copy+of+requester (*).csv'

  supplier:
    folder: misc_mdm
    name: 'Suppliers.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'Suppliers.csv'
        - 'Suppliers (*).csv'

  vendor_item:
    folder: misc_mdm
    name: 'VendorItems.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'VendorItems.csv'
        - 'VendorItems (*).csv'

  vendor_location:
    folder: misc_mdm
    name: 'VendorLocation_Preprocessor.csv'
    tags: [daily, mdm]
    download:
      patterns:
        - 'VendorLocation_Preprocessor.csv'
        - 'VendorLocation_Preprocessor (*).csv'

  # ==== GHX CCX export : ccx ================================================
  # The "Search Sync Contract" saved search downloads with an embedded run
  # timestamp in the name, e.g. 'searchSyncContract_31_7_2026_9_55_27 am.csv'
  # (and the browser's ' (N)' re-download variant). The single glob below matches
  # any of them -- no other export starts with 'searchSyncContract_' -- and each
  # match is renamed to the canonical name the loader reads. pick_latest (the
  # default) keeps only the newest by mtime.
  ccx_sync_contract:
    folder: ccx
    name: 'searchSyncContract.csv'
    tags: [daily]
    download:
      patterns:
        - 'searchSyncContract_*.csv'

  # ==== on-demand GHX export : misc_mdm ====================================
  # "Completed Invoices by Date" (GHX Catalyst), consumed by the on-demand
  # ghx_completed_invoice_by_date loader (configs\loaders\on-demand\). It lands in
  # Downloads like the other exports (the browser's ' (N)' re-download variant is
  # matched too) and is relocated to misc mdm under the canonical name. The
  # 'on-demand' tag keeps it OUT of the unfiltered daily `move-files` dispatch and
  # the daily --check scan, so it is not pulled from Downloads before its loader
  # is run by hand; the loader's own run-time download gate stages it on demand.
  # Select it explicitly with `move-files --input ghx_completed_invoice_by_date`.
  ghx_completed_invoice_by_date:
    folder: misc_mdm
    name: 'Completed Invoices by Date.xlsx'
    tags: [on-demand]
    download:
      patterns:
        - 'Completed Invoices by Date.xlsx'
        - 'Completed Invoices by Date (*).xlsx'

  # ==== on-demand PPE master workbook (FIXTURE) : custom_made ===============
  # One hand-maintained Excel workbook feeds all four on-demand PPE loaders
  # (ppe_category / ppe_item / ppe_parloc / ppe_facility), each reading its own
  # sheet. It is a FIXTURE, not a download: it lives in custom_made and a human
  # edits it in place. Before an update, the human bumps the timestamp suffix on
  # the file name (e.g. PPE_MASTER_FILE_PREP_02060624.xlsx -> ..._<newstamp>.xlsx),
  # so `name` is a GLOB rather than a fixed name -- SourceFile.resolve() matches it
  # regardless of the current suffix (each loader sets pick_latest: true so the
  # newest match wins if more than one is ever present). No `download` block (so
  # move-files never relocates it) and the loaders set archive.enabled: false (the
  # workbook is the fixture of record and stays put -- see the four ppe_* loaders).
  # 'on-demand' keeps it out of the daily dispatch/--check for good measure.
  ppe_master:
    folder: custom_made
    name: 'PPE_MASTER_FILE_PREP_*.xlsx'
    tags: [on-demand, ppe]
