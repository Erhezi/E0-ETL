    tags: [daily]
    download:
      patterns:
        - 'PRD_DataTeam_PayablesInvoicePayment_ZFCH.csv'
        - 'PRD_DataTeam_PayablesInvoicePayment_ZFCH (*).csv'

  # purchaseorder_line reads four files: this main export plus company_map/fd3/fd5.
  poline:
    folder: temp_export
    name: 'DataTeamPRD_POline_DL.csv'
    tags: [daily]
    download:
      patterns:
