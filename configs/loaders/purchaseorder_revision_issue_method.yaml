name: purchaseorder_revision_issue_method
enabled: true
tags: [daily, transactional, PurchaseOrderRevisionIssueMethod]

process:
  name: Purchase Order Revision Issue Method
  frequency: Workdays

# One row per PO: the export flattens the PO's revision relation to the
# first-revision issue date, the revision count and the revision-level issue
# method, alongside the PO's own issue method.
source:
  multiple_input_files: false
  files:
    - alias: main
      input: purchaseorder_revision_issue_method   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# Each destination's server/database/schema are defaults inherited by both the
# staging and prod blocks. To land staging in a different database (or server or
# schema) than prod, set server/database/schema inside that block to override.
# prod.post_sql runs on the prod connection after the staging load succeeds, to
# promote the just-loaded staging data into prod. Each step gets its own ETLHealth row.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    staging:
      table: purchaseorder_revision_issuemethod_stg
    prod:
      table: PURCHASEORDER_REVISION_ISSUEMETHOD
      post_sql:
        - EXEC [DM_MONTYNT\dli2].[UpdatePurchaseOrderRevisionIssueMethod]

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    staging:
      table: purchaseorder_revision_issuemethod_stg
    prod:
      table: PURCHASEORDER_REVISION_ISSUEMETHOD
      post_sql:
        - EXEC [infor].[sp_UpdatePurchaseOrderRevisionIssueMethod]

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (purchaseorder_revision_issue_method).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g.
# PRD_DataTeam_PurchaseOrder_RevisionRel_20260715.csv. <loader name> is
# substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

stg_load:
  strategy: truncate_insert   # how the staging table is loaded from the source file
  batch_size: 50000

# How the prod table is promoted from the just-loaded staging table.
# Allowed: truncate_insert | pk_merge | pk_delete_insert | pk_delete_insert_on_header
#          | versioned_delete_insert | filter_active
# pk_delete_insert: DELETE prod rows matching staging on the full PK -- here just
#   (PO), the table is one row per PO -- then INSERT all staging rows. POs absent
#   from the file are left in place, so a rolling window of POs accumulates in
#   prod as history.
# VERIFIED against both procs (read 2026-07-15): UpdatePurchaseOrderRevisionIssueMethod
# and [infor].sp_UpdatePurchaseOrderRevisionIssueMethod delete prod joining
# staging on po alone (the procs note: the export is keyed on the PO's update,
# not a line's), then run
#   INSERT INTO PURCHASEORDER_REVISION_ISSUEMETHOD SELECT * FROM purchaseorder_revision_issuemethod_stg
# The insert is POSITIONAL (SELECT *): staging and prod column order were verified
# identical on both destinations, and the mapping below is kept in that same table
# order -- do not reorder it without also altering both tables and the procs.
# DECLARATIVE ONLY for now: the real promotion runs via each destination's
# prod.post_sql (EXEC ...UpdatePurchaseOrderRevisionIssueMethod). This records
# intent and is validated at load time, but is not yet dispatched by the loader.
prd_load:
  strategy: pk_delete_insert

# Delta-overlap guard: enforce. Like purchaseorder_receipt_line, this export is a
# rolling window keyed on a stamp that lands in the destination: the PO's own
# "update stamp". The 2026-07-15 file spanned exactly
# 2026-07-08 00:32:52 -> 2026-07-15 00:17:44 (9,911 rows), a clean ~7-day window.
# Make sure the incoming window overlaps what is already stored so no POs fall
# through the gap between runs:
#   pass  <=>  MIN(source[update stamp])  <=  MAX(prod[update stamp])
# mode: enforce = fail the destination on a gap | warn = log and continue | skip = do not run.
# Runs before the staging truncate/insert, so a gap aborts the destination without
# touching stored data.
validation:
  overlap_check:
    mode: enforce
    source_column: 'update stamp'   # column in the prepared source frame (post-rename, pre-mapping)
    db_column: 'update stamp'       # same column, read from the baseline table below
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

use_db_column_order: false

# No transforms: the export loads as-is (renames and type conversion are handled
# by the mapping below).

field_config:
  # strptime format for `date`-typed source columns, e.g. 10/19/2023. Verified
  # against the whole 2026-07-15 file: all three date columns parse with this
  # format (no YYYYMMDD mixing like purchaseorder_line's MMAHSPurchaseOrderDate).
  date_format: '%m/%d/%Y'
  # strptime format for `datetime`-typed source columns, e.g. 10/19/2023 01:33:43 PM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column
  # names (matches PK_PO_RevIssueMethod on the destination table). The export is
  # one row per PO, so a failure here means the export shipped a duplicate PO.
  pk_check: [PO]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # KEEP THIS IN TABLE ORDER: the promotion procs' INSERT ... SELECT * is
  # positional (see prd_load note above).
  # Never-revised POs ship blanks in the revision-derived columns
  # (POFirstRevisionIssueDate / PORevisionRel.IssueMethod, 170 of 9,911 rows in
  # the 2026-07-15 file; PORevision blank on 8,680). A blank int lands as NULL,
  # but a blank date lands as the loader's 1900-01-01 fallback, not NULL -- treat
  # POFirstRevisionIssueDate = 1900-01-01 as "no revision issued".
  mapping:
    - [Company, Company, string, varchar(10), source]
    - [PurchaseOrderDate, PODate, date, date, source]
    - [MMAHSPOReleaseDate, POReleaseDate, date, date, source]
    - [PurchaseOrder, PO, string, varchar(20), source]
    - [MMAHSPurchaseOrderFirstRevisionIssueDate, POFirstRevisionIssueDate, date, date, source]
    - [PurchaseOrderRevision, PORevision, int, int, source]
    - [IssueMethod, PurchaseOrder.IssueMethod, string, varchar(20), source]
    - [PurchaseOrderRevisionsRel.IssueMethod, PORevisionRel.IssueMethod, string, varchar(20), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]

  # Every source column is loaded; nothing extra ships in this export.
