name: item_replenish_from
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in
# the misc mdm folder (ItemReplenishFrom.csv refreshes alongside the other mdm
# exports).
tags: [daily, mdm, ItemReplenishFrom]

process:
  name: MDM Item Replenish From
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: item_replenish_from   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- each destination's single
# table is truncate+inserted in place (see mdm_vendor_item.yaml for the full
# pattern description). Replaces the manual notebook flow (INFOR table
# update.ipynb "ItemReplenishFrom"): read ItemReplenishFrom.csv -> truncate
# [Preprocessor].InforItemReplenishFrom -> positional insert. NOTE: unlike the
# MDM_* loaders, des1 lands in PRIME's [Preprocessor] schema, not
# [DM_MONTYNT\dli2] -- that is where the notebook always loaded it.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: Preprocessor
    table: InforItemReplenishFrom

  # Landing copy in the Preprocessor DATABASE on the shared server. That
  # database's only schema is [Preprocessor] (no [infor] schema exists there),
  # and it ships a prepped, currently-empty InforItemReplenishFrom -- VERIFIED
  # identical 15 columns and the same 4-column PK on 2026-07-23.
  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: Preprocessor
    schema: infor
    table: ItemReplenishFrom

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (item_replenish_from).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. ItemReplenishFrom_20260723.csv.
# <loader name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of all
# item replenishment sources (56,441 rows in the 2026-07-23 sample), not a
# delta window, so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# No transforms: nothing is computed. Int/datetime typing comes from the
# mapping, string blanks are filled by normalize_for_db, numeric blanks stay
# NULL (general_rules.md).

# Both destination tables have PK_InforItemReplenishFrom on (Company, Location,
# Item, Vendor). An (item, location) can list two replenishment sources
# (priority 1 and 2), so Vendor is part of the key; the export is one row per
# 4-column key (0 duplicate keys, no whitespace padding in the 2026-07-23
# sample). A duplicate would be an export defect -- fail here, BEFORE the
# truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # strptime format for `datetime`-typed source columns, e.g. 07/20/2025 10:24:40 PM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column
  # names (matches PK_InforItemReplenishFrom on both destination tables).
  pk_check: [Company, Location, Item, Vendor]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against PRIME.[Preprocessor].InforItemReplenishFrom
  # and Preprocessor.[Preprocessor].InforItemReplenishFrom on 2026-07-23. Every
  # source column is loaded; note the renames, which the manual notebook loads
  # handled positionally.
  mapping:
    - [Company, Company, string, varchar(10), source]
    - [InventoryLocation, Location, string, varchar(20), source]
    - [InventoryLocation.LocationType, LocationType, string, varchar(40), source]
    - [InventoryLocation.Name, LocationText, string, varchar(255), source]
    - [Item, Item, string, varchar(10), source]
    - [UseVendorOrReplenishFrom, UseVendorOrReplenishFrom, string, varchar(20), source]
    - [ReplenishFrom.ReplenishFromCompany, ReplenishFromCompany, string, varchar(10), source]
    - [ReplenishFrom.ReplenishFromLocation, ReplenishFromLocation, string, varchar(20), source]
    # Always 1 or 2 in the export (never blank); NOT NULL int in both
    # destinations, so a blank would fail the insert loudly -- intentional.
    - [ItemReplenishmentSource.ReplenishmentPriority, ReplenishmentPriority, int, int, source]
    - [Vendor, Vendor, string, varchar(10), source]
    - [Vendor.VendorName, VendorName, string, varchar(255), source]
    - [PurchaseFromLocation, PurchaseFromLocation, string, varchar(10), source]
    # The export header really is parenthesized -- keep it, do not "fix" it.
    - ['(PurchaseFromLocation.VendorName translation)', PurchaseFromLocationText, string, varchar(255), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]

  # Every source column is loaded; nothing extra ships in this export.
