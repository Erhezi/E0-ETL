name: payablesinvoice_payment
enabled: true
tags: [daily, PayablesInvoicePayment]

process:
  name: Payables Invoice Payment
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      path: 'C:\Users\dli2\OneDrive - Montefiore Medicine\Documents\INFOR_SC\temp export'
      name: 'PRD_DataTeam_PayablesInvoicePayment_ZFCH.csv'
      reader: csv
      options:
        dtype: str

# Each destination's server/database/schema are defaults inherited by both the
# staging and prod blocks. To land staging in a different database (or server or
# schema) than prod, set server/database/schema inside that block to override.
# prod.post_sql runs on the prod connection after the staging load succeeds, to
# promote the just-loaded staging data into prod. Each step gets its own ETLHealth row.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    staging:
      table: payablesinvoice_payment_stg
    prod:
      table: PAYABLESINVOICE_PAYMENT
      # Header-level replace (see prd_load below): DELETE prod rows joined to
      # staging on (Company, PayablesInvoice), then INSERT all staging rows.
      # The proc's leading ROW_NUMBER() dedup DELETE is superseded by the
      # dedup_keep_first transform below, which now runs in Python before the
      # staging load; once this loader is live the dedup step can be dropped
      # from the proc (it becomes a no-op against already-deduped staging).
      post_sql:
        - EXEC [DM_MONTYNT\dli2].[UpdatePayablesInvoicePayment]

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    staging:
      table: payablesinvoice_payment_stg
    prod:
      table: PAYABLESINVOICE_PAYMENT
      post_sql:
        - EXEC [infor].[sp_UpdatePayablesInvoicePayment]

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (payablesinvoice_payment).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. PRD_DataTeam_PayablesInvoicePayment_ZFCH_20260713.csv.
# <loader name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

stg_load:
  strategy: truncate_insert   # how the staging table is loaded from the source file
  batch_size: 50000

# How the prod table is promoted from the just-loaded staging table.
# Allowed: truncate_insert | pk_merge | pk_delete_insert | pk_delete_insert_on_header
#          | versioned_delete_insert | filter_active
# pk_delete_insert_on_header: DELETE prod rows matching staging on the HEADER-level
#   key (Company, PayablesInvoice) -- a prefix of the PK, not the full PK -- then
#   INSERT all staging rows. Whole invoices' payment histories are replaced rather
#   than upserted row by row, because the export window is keyed on the invoice's
#   update stamp (PayablesInvoice.update stamp) and each export carries the full
#   payment set for every invoice it includes: replacing the header makes payment
#   rows that stop appearing (e.g. re-keyed transient payments) disappear from
#   prod too. Invoices absent from the file are left in place, so a rolling
#   window of invoices accumulates in prod as history.
# DECLARATIVE ONLY for now: the real promotion runs via each destination's
# prod.post_sql (the header-join DELETE + INSERT..SELECT in the Update procs).
# This records intent and is validated at load time, but is not yet dispatched
# by the loader; header_key is the spec a later template-based query generator
# will fill in.
prd_load:
  strategy: pk_delete_insert_on_header
  header_key: [Company, PayablesInvoice]

# Delta-overlap guard: skip, same reasoning as payablesinvoice_distribution. The
# export window is keyed on the PARENT invoice's stamp (PayablesInvoice.update
# stamp), which is not landed in the destination table, so there is no DB column
# to compare MIN(source) against. The payment row's own "update stamp" cannot
# stand in for it: a just-exported invoice can carry payment rows whose own
# stamps are years old, so the check would be a trivial always-pass, not a guard.
# If PayablesInvoice.update stamp is ever added to the table, switch this to
# mode: enforce on that column.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

use_db_column_order: false

# dedup_keep_first replicates the ROW_NUMBER() dedup that used to run as the first
# DELETE inside the Update procs ("delete the 0 value dup lines"):
#   ROW_NUMBER() OVER (PARTITION BY Company, PayablesInvoice, TransientPaymentNumber,
#                      VoidDate, [create stamp]
#                      ORDER BY Company, BankStatus, [update stamp] DESC) = 1
# Moved to Python so it runs BEFORE the pk_check and the staging insert: the file
# routinely ships exact-PK duplicates (zero-value dup lines) that differ only on
# BankStatus / update stamp, and the lowest BankStatus + latest update stamp row
# is the one kept. Transforms see SOURCE column names (pre-mapping), hence
# PayablesInvoice.TransientPaymentNumber below; the SQL's ORDER BY Company is a
# no-op (Company is in the partition key) and is dropped. Registered in
# infor_loader/transforms.py.
transforms:
  - dedup_keep_first

transform_options:
  dedup:
    keys: [Company, PayablesInvoice, PayablesInvoice.TransientPaymentNumber, VoidDate, create stamp]
    order_by:
      - {column: BankStatus, direction: asc}
      - {column: update stamp, direction: desc}

field_config:
  # strptime format for `date`-typed source columns, e.g. 11/14/2018.
  date_format: '%m/%d/%Y'
  # strptime format for `datetime`-typed source columns, e.g. 10/01/2023 01:04:19 PM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column names
  # (matches PK_PayablesInvoicePMT on the destination table). The dedup_keep_first
  # transform above collapses expected duplicates on exactly this key first, so a
  # pk_check failure here means a genuinely new kind of collision.
  pk_check: [Company, PayablesInvoice, TransientPaymentNumber, VoidDate, create stamp]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  mapping:
    - [Company, Company, string, varchar(10), source]
    - [DerivedCompanyRepresentativeText, CompanyRepText, string, varchar(255), source]
    - [PayablesInvoice, PayablesInvoice, string, varchar(40), source]
    - [TransactionNumber, TransactionNumber, string, varchar(20), source]
    - [PayablesInvoice.TransientPaymentNumber, TransientPaymentNumber, string, varchar(20), source]
    - [PayablesInvoice.TransientPaymentDate, TransientPaymentDate, date, date, source]
    - [CheckDate, CheckDate, date, date, source]
    - [VoidDate, VoidDate, date, date, source]
    - [BankCheckAmount, CheckAmount, float, money, source]
    - [PaymentStatus, PaymentStatus, string, varchar(100), source]
    - [BankStatus, BankStatus, string, varchar(40), source]
    - [DerivedInvoice, Invoice, string, varchar(255), source]
    - [PayablesInvoice.InvoiceStatus, InvoiceStatus, string, varchar(40), source]
    - [DerivedInvoiceDate, InvoiceDate, date, date, source]
    - [DerivedInvoiceType, InvoiceType, string, varchar(20), source]
    - [Vendor, Vendor, string, varchar(40), source]
    - [CashCode, CashCode, string, varchar(20), source]
    - [BankTransactionCode, BankTransactionCode, string, varchar(20), source]
    - [IsApplied, IsApplied, string, varchar(10), source]
    - [CreatedBy, CreatedBy, string, varchar(100), source]
    - [LastUpdateBy, LastUpdateBy, string, varchar(100), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]

  # Present in the source file but not integrated into the pipeline yet. Optional:
  # a missing one only warns, since it cannot affect the output.
  extra:
    - PayablesInvoice.DerivedInvoiceAmount
    - DueDate
    - DerivedDaysPastDue
    - AgingMethod
    - AgeByInvoiceDate
    - VendorClass
    - PayablesInvoice.update stamp   # parent invoice's stamp (the export window key); not in the destination table
