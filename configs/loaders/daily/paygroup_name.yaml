name: paygroup_name
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (PayGroupName.csv refreshes alongside the other mdm exports).
tags: [daily, mdm, PayGroupName]

process:
  name: MDM PayGroup Name
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: paygroup_name   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- the single destination table
# is truncate+inserted in place (see vendor_item.yaml for the full pattern
# description).
#
# O2 (DES2) ONLY -- new loader, no PRIME (des1) counterpart (general_rules.md:
# new loaders land des2 only). The table is created by
# sql\paygroup_name\des2_infor_create_mdm_paygroup_name.sql. It is NOT the
# MDM.dbo.MDM_PAYGROUP_NAME table of the same name in O2's MDM database.
destinations:
  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_PAYGROUP_NAME

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (paygroup_name).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. PayGroupName_20261119.csv.
# <loader name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is the full pay-group list (16 rows in
# the 2026-11-19 sample), not a delta window, so there is no gap between runs to
# guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Stamps ReportDate only.
transforms:
  - paygroup_name

# One row per (VendorGroup, PayGroup) -- Infor keys the PayGroup business class
# that way (a pay group is defined within a vendor group). 0 duplicates in the
# 2026-11-19 sample, which has a single VendorGroup ('1'). A duplicate would be
# an export defect that the PK rejects mid-insert AFTER the truncate -- fail
# fast here, BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # strptime format for `datetime`-typed source columns, e.g. 04/08/2022 01:46:24 PM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column
  # names (matches PK_MDM_PAYGROUP_NAME; PayGroup alone is IX_MDM_PAYGROUP_NAME_PayGroup,
  # non-unique).
  pk_check: [VendorGroup, PayGroup]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Names match the export. VendorGroup, PayGroup and CashCode look numeric but
  # are codes ('2010', '2010.80844'), so they stay strings. Table columns
  # VERIFIED live via table-info on 2026-11-19.
  mapping:
    - [VendorGroup, VendorGroup, string, varchar(10), source]
    - [Active, Active, string, varchar(5), source]
    - [BankTransactionCode, BankTransactionCode, string, varchar(10), source]
    - [CashCode, CashCode, string, varchar(30), source]
    - [DerivedPayGroupTitle, DerivedPayGroupTitle, string, varchar(255), source]
    - [Name, Name, string, varchar(255), source]
    - [PayGroup, PayGroup, string, varchar(10), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]
    # Load-date marker produced by the transform (today's date as 'YYYY-MM-DD');
    # tells consumers when this snapshot was last reloaded.
    - [ReportDate, ReportDate, date, date, computed]

  # Every source column is loaded; nothing extra ships in this export.
