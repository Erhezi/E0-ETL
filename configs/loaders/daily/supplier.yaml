name: supplier
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (Suppliers.csv refreshes alongside the other mdm exports).
tags: [daily, mdm, Supplier]

process:
  name: MDM Supplier
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: supplier   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- the single destination table
# is truncate+inserted in place (see mdm_vendor_item.yaml for the full pattern
# description). Replaces the manual notebook flow (INFOR table update.ipynb
# "Supplier"): read Suppliers.csv -> derive Supplier from RepresentativeText ->
# select columns -> truncate MDM_SUPPLIER_NAME_INFOR -> positional insert.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: MDM_SUPPLIER_NAME_INFOR

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_SUPPLIER_NAME

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (supplier).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. Suppliers_20260727.csv. <loader name>
# is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of the
# supplier master (1,715 rows in the 2026-07-27 sample), not a delta window, so
# there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Derives the Supplier code from
# RepresentativeText (the part before ' - ', e.g. '1 - PREMIER, INC' -> '1') and
# stamps ReportDate; column selection and source->destination renaming are
# handled by the mapping below.
transforms:
  - supplier

# The export is one row per derived Supplier code (0 duplicate keys in the
# 2026-07-27 sample). A duplicate would be an export defect -- fail here, BEFORE
# the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # No date/datetime-typed source columns are loaded (ReportDate is computed by
  # the transform, already ISO-formatted), so no formats are needed.

  # PK check runs after mapping/data conversion, so this is the destination
  # column name. Supplier is computed by the transform (see above).
  pk_check: [Supplier]

  # RepresentativeText is consumed by the supplier transform (to derive Supplier)
  # AND loaded to a destination, so it appears as a normal source row below --
  # no separate transform_inputs entry is needed.

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # NOTE: destination names differ from the source names -- the notebook's
  # positional insert hid this; the mapping renames by name. Destination
  # names/types VERIFIED against PRIME.[DM_MONTYNT\dli2].MDM_SUPPLIER_NAME_INFOR
  # via table-info on 2026-07-27.
  mapping:
    - [Supplier, Supplier, string, varchar(10), computed]           # supplier transform: RepresentativeText before ' - '
    - [RepresentativeText, RepresentativeText, string, varchar(255), source]
    - [SupplierName, SupplierName, string, varchar(255), source]
    - [Vendor, Vendor, string, varchar(10), source]
    - [Vendor.VendorName, VendorName, string, varchar(255), source]
    - [Vendor.VendorClass, VendorClass, string, varchar(10), source]
    - [Active, Active, string, varchar(10), source]
    - [HasBeenValidated, HasBeenValidated, string, varchar(10), source]
    # Load-date marker produced by the supplier transform (today's date as
    # 'YYYY-MM-DD'); tells consumers when this snapshot was last reloaded.
    - [ReportDate, ReportDate, date, date, computed]

  # Present in the source file but not loaded (the manual notebook dropped these
  # too). Optional: a missing one only warns, since it cannot affect the output.
  extra:
    - SupplierGroup
    - BusinessType
    - DandBNbr
    - DateRegistered
    - DerivedTaxId
    - DerivedVAT
    - DoingBusinessAs
    - create stamp
    - update stamp
