name: ccx_sync_contract
enabled: true
# 'daily' opts this loader into the scheduled workday run (gated on a fresh
# searchSyncContract export in Downloads -- it skips + logs FILE_NOT_FOUND when
# none is present, so prod is never re-truncated with a stale copy).
# 'ghx' groups the GHX/CCX loaders; 'CCXSyncContract' is the self-select tag.
tags: [daily, ghx, CCXSyncContract]

process:
  name: GHX CCX Sync Contract
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: ccx_sync_contract   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        # The export ships a one-line title banner ("Search Sync Contract") ABOVE
        # the real column header, so skip it -- row 2 is the 13-column header.
        skiprows: 1
        dtype: str

# DIRECT LOAD: this is a full point-in-time snapshot of the CCX contract sync
# status (one row per GHX ContractRefID), so each destination's single table is
# truncate+inserted in place -- no staging table (see item_replenish_from.yaml
# for the full pattern description). Replaces the manual notebook load of the
# same searchSyncContract export.
#
# Object names/types VERIFIED via table-info on 2026-07-31 -- both tables carry
# the same 14 columns (PK on ContractRefID), the des2 landing copy is currently
# empty (first load), des1 already holds the manual-notebook rows:
#   des1  PRIME.[Preprocessor].CCXSyncContract           (MISCPrdAdhocDB)
#   des2  Preprocessor.[ghx].CCXSyncContract             (YNBBSTVWP02\PROCDATASRVPROD)
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: Preprocessor
    table: CCXSyncContract

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: Preprocessor
    schema: ghx
    table: CCXSyncContract

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (ccx_sync_contract).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# Standard archive behavior (same as every other loader): after a successful
# load the source file is copied here with a _YYYYMMDD stamp appended, e.g.
# searchSyncContract_20260731.csv. <loader name> is substituted with this
# loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of all
# CCX sync-contract rows (9,516 in the 2026-07-31 sample), not a rolling delta
# window, so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Converts Synced (True/False) -> 1/0,
# stamps 'report stamp' with the load time, and trims Organization; column
# selection, date typing, and blank-filling are handled by the mapping below.
transforms:
  - ccx_sync_contract

# Both destination tables' PK is on ContractRefID alone (the unique per-row GHX
# contract reference id -- Contract # / ContractID repeats across orgs). The
# export is one row per ContractRefID (0 duplicate keys, 0 blanks in the
# 2026-07-31 sample). A duplicate would be an export defect -- fail here, BEFORE
# the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # strptime format for the two `date`-typed source columns (e.g. 11/01/2024).
  # They are date-only (no time-of-day), so a strict `date` parse is safe.
  date_format: '%m/%d/%Y'

  # PK check runs after mapping/data conversion, so this is the destination
  # column name (matches the PK on both destination tables).
  pk_check: [ContractRefID]

  # Loaded columns, ordered like the destination tables (ordinal position). Row
  # format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against both CCXSyncContract tables via
  # table-info on 2026-07-31.
  mapping:
    # Synced ships as the literal text True/False; the ccx_sync_contract transform
    # converts it to 1/0. Typed `string` (NOT `int`) on purpose: apply_type_changes
    # runs BEFORE the transform, so an `int` type would try to int-cast the bool
    # text and fail. SQL Server implicitly converts the '1'/'0' to the int column.
    - ['Synced', Sync, string, int, source]
    - [Organization, Organization, string, varchar(100), source]
    - [Manufacturer, Manufacturer, string, varchar(255), source]
    - [Vendor, Vendor, string, varchar(255), source]
    - ['Contract #', ContractID, string, varchar(100), source]
    # ERP* columns are frequently blank in the export (nullable in both tables);
    # blanks land as '' via normalize_for_db, like every other string column.
    - ['ERP vendor #', ERPVendorID, string, varchar(20), source]
    - ['ERP Manufacturer Name', ERPManufacturerName, string, varchar(255), source]
    - ['ERP Manufacturer #', ERPManufacturerID, string, varchar(20), source]
    - ['Contract Ref ID', ContractRefID, string, varchar(10), source]
    - ['Contract Desc', ContractDescription, string, varchar(255), source]
    - [Source, ContractSourceType, string, varchar(20), source]
    # Load timestamp set by the transform (nullable datetime; no source column).
    - [report stamp, report stamp, datetime, datetime, computed]
    - ['Effective Date', EffectiveDate, date, date, source]
    - ['Expiration Date', ExpirationDate, date, date, source]

  # Every source column is loaded; nothing extra ships in this export.
