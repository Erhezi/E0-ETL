name: manufacturer
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (Manufacturers.csv refreshes alongside the other mdm exports).
tags: [daily, mdm, Manufacturer]

process:
  name: MDM Manufacturer
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: manufacturer   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- the single destination table
# is truncate+inserted in place (see mdm_vendor_item.yaml for the full pattern
# description). Replaces the manual notebook flow (INFOR table update.ipynb
# "Manufacturer"): read Manufacturers.csv -> select 4 columns -> truncate
# MDM_MANUFACTURER_NAME_INFOR -> positional insert.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: MDM_MANUFACTURER_NAME_INFOR

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_MANUFACTURER_NAME

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (manufacturer).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. Manufacturers_20260727.csv. <loader
# name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of the
# manufacturer master (2,027 rows in the 2026-07-27 sample), not a delta window,
# so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Stamps ReportDate with today's date
# (-> the LastUpdated date column); column selection and source->destination
# renaming are handled by the mapping below.
transforms:
  - manufacturer

# The export is one row per Manufacturer (0 duplicate keys, no whitespace
# padding in the 2026-07-27 sample). A duplicate would be an export defect --
# fail here, BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # No date/datetime-typed source columns are loaded (LastUpdated is computed by
  # the transform, already ISO-formatted), so no formats are needed.

  # PK check runs after mapping/data conversion, so this is the destination
  # column name.
  pk_check: [Manufacturer]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # NOTE: destination names differ from the source names -- the notebook's
  # positional insert hid this; the mapping renames by name. Destination
  # names/types VERIFIED against PRIME.[DM_MONTYNT\dli2].MDM_MANUFACTURER_NAME_INFOR
  # via table-info on 2026-07-27.
  mapping:
    - [Manufacturer, Manufacturer, string, varchar(10), source]
    - [MMAHSManufacturerEID, ManufacturerEID, string, varchar(20), source]
    - [Description, ManufacturerName, string, varchar(255), source]
    - [Active, Active, string, varchar(5), source]
    # Load-date marker produced by the manufacturer transform (today's date as
    # 'YYYY-MM-DD'); tells consumers when this snapshot was last reloaded.
    - [ReportDate, LastUpdated, date, date, computed]

  # Present in the source file but not loaded (the manual notebook dropped these
  # too). Optional: a missing one only warns, since it cannot affect the output.
  extra:
    - ItemGroup
    - DerivedCodeDivisionDescription
    - create stamp
    - update stamp
