name: vendor
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (PRD_DataTeam_VM_DL.csv refreshes alongside the other mdm
# exports).
tags: [daily, mdm, Vendor]

process:
  name: MDM Vendor
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: vendor   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- the single destination table
# is truncate+inserted in place (see mdm_vendor_item.yaml for the full pattern
# description). New loader, not a notebook port: read PRD_DataTeam_VM_DL.csv ->
# drop the export's subtotal trailers -> truncate MDM_VENDOR_INFOR -> insert.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: MDM_VENDOR_INFOR

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_VENDOR

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (vendor).
  log_root: '\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. PRD_DataTeam_VM_DL_20260901.csv.
# <loader name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of the
# vendor master (39,169 data rows in the 2026-09-01 sample), not a delta window,
# so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Drops the export's two subtotal
# trailer rows (the saved search ships with subtotals on -- see the transform)
# and stamps ReportDate; column selection, source->destination renaming, and
# stamp typing are handled by the mapping below.
transforms:
  - vendor

# The export is one row per Vendor (0 duplicate keys, no whitespace padding on
# the key in the 2026-09-01 sample), and both destination tables enforce it with
# PK_MDM_VENDOR_INFOR / PK_MDM_VENDOR on (Vendor). A duplicate would be an export
# defect -- fail here, BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # strptime format for the two `datetime`-typed source columns,
  # e.g. 07/14/2023 05:59:06 PM. Set explicitly so pandas parses fast and
  # unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so this is the destination
  # column name -- same as the source name here, and it matches the PRIMARY KEY
  # on both destination tables.
  pk_check: [Vendor]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Every one of the export's 33 columns is loaded; there is no `extra` block.
  # The three <field>.Description lookups are renamed to the concatenated form
  # used elsewhere (Item.Description -> ItemDescription); the four Infor stamp
  # columns keep their literal dotted/spaced names, as in contract_line.
  # Destination names/types VERIFIED against
  # PRIME.[DM_MONTYNT\dli2].MDM_VENDOR_INFOR and
  # PLMPreprocessorShared.[infor].MDM_VENDOR via table-info on 2026-09-01
  # (both created that day; 34 columns, identical shape on both sides).
  mapping:
    - [Vendor, Vendor, string, varchar(10), source]
    - [VendorName, VendorName, string, varchar(255), source]
    - [LegalName, LegalName, string, varchar(255), source]
    - [VendorSearchName, VendorSearchName, string, varchar(255), source]
    - [VendorGroup, VendorGroup, string, varchar(10), source]
    - [VendorClass, VendorClass, string, varchar(10), source]
    - [VendorClass.Description, VendorClassDescription, string, varchar(255), source]
    - [LocationIndicatorBoolean, LocationIndicatorBoolean, string, varchar(10), source]
    - [ContactName, ContactName, string, varchar(255), source]
    # Values carry the export's literal 'Phone:  ' prefix, so the column keeps
    # its display-oriented source name rather than being renamed PhoneNumber.
    - [PhoneNumberCardViewDisplay, PhoneNumberCardViewDisplay, string, varchar(100), source]
    - [EmailAddress, EmailAddress, string, varchar(255), source]
    - [VendorAddressLine1, VendorAddressLine1, string, varchar(100), source]
    - [VendorAddressLine2, VendorAddressLine2, string, varchar(100), source]
    - [VendorCity, VendorCity, string, varchar(50), source]
    - [VendorStateProvince, VendorStateProvince, string, varchar(10), source]
    - [VendorCountry, VendorCountry, string, varchar(10), source]
    - [VendorPostalCode, VendorPostalCode, string, varchar(20), source]
    - [TaxIDType, TaxIDType, string, varchar(20), source]
    - [TaxID, TaxID, string, varchar(30), source]
    - [DunAndBradstreetNumber, DunAndBradstreetNumber, string, varchar(20), source]
    # 100% blank in the 2026-09-01 export. Loaded anyway (landing as '' like any
    # other blank string) so the column is already in place and wired up if Infor
    # starts populating it -- no schema or mapping change needed then.
    - [EDINumber, EDINumber, string, varchar(30), source]
    - [LegacyVendor, LegacyVendor, string, varchar(20), source]
    - [Reference1, Reference1, string, varchar(100), source]
    - [Reference2, Reference2, string, varchar(100), source]
    - [VendorStatus, VendorStatus, string, varchar(40), source]
    - [TermsCode, TermsCode, string, varchar(10), source]
    # Ships space-padded to 60 in the export; not part of the PK, so the default
    # trim is safe and the stored value is the 13-char trimmed text.
    - [TermsCode.Description, TermsCodeDescription, string, varchar(100), source]
    - [BankTransactionCode, BankTransactionCode, string, varchar(10), source]
    - [BankTransactionCode.Description, BankTransactionCodeDescription, string, varchar(100), source]
    - ['create stamp.actor', 'create stamp.actor', string, varchar(100), source]
    - ['update stamp.actor', 'update stamp.actor', string, varchar(100), source]
    - ['create stamp', 'create stamp', datetime, datetime, source]
    - ['update stamp', 'update stamp', datetime, datetime, source]
    # Load-date marker produced by the vendor transform (today's date as
    # 'YYYY-MM-DD'); tells consumers when this snapshot was last reloaded.
    - [ReportDate, ReportDate, date, date, computed]
