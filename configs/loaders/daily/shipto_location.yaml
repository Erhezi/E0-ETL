name: shipto_location
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (ShipTo+Location.csv refreshes alongside the other mdm exports).
tags: [daily, mdm, ShipToLocation]

process:
  name: MDM ShipTo Location
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: shipto_location   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- the single destination table
# is truncate+inserted in place (see vendor_item.yaml for the full pattern
# description).
#
# O2 (DES2) ONLY -- new loader, no PRIME (des1) counterpart (general_rules.md:
# new loaders land des2 only). The table is created by
# sql\shipto_location\des2_infor_create_mdm_shipto_location.sql.
destinations:
  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_SHIPTO_LOCATION

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (shipto_location).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. ShipTo+Location_20261119.csv.
# <loader name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of the
# ship-to locations (4,200 rows in the 2026-11-19 sample), not a delta window,
# so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Stamps ReportDate only.
transforms:
  - shipto_location

# One row per (Company, InventoryLocation) -- 0 duplicates in the 2026-11-19
# sample; InventoryLocation alone repeats across companies. A duplicate would be
# an export defect that the PK rejects mid-insert AFTER the truncate -- fail
# fast here, BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # strptime format for `datetime`-typed source columns, e.g. 03/17/2023 12:06:56 PM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column
  # names (matches PK_MDM_SHIPTO_LOCATION).
  pk_check: [Company, InventoryLocation]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # The PostalAddress.* parts drop their prefix, as in MDM_REQUESTING_LOCATION
  # (DisplayAddressLine1/2 -> AddressLine1/2). Table columns VERIFIED live via
  # table-info on 2026-11-19.
  # Data notes from the 2026-11-19 sample:
  #   - 6 rows have no address at all (every PostalAddress column blank -> '').
  #   - Name / DerivedNameID on 2 rows (Company 3000, SOFF01860 and SOFF03615)
  #     carry mojibake box-drawing characters from Infor. varchar (code page
  #     1252) cannot hold them, so SQL Server stores best-fit look-alikes or '?'
  #     instead. The text was unreadable at the source, so nothing is lost.
  #   - A few Name / DerivedNameID / AddressLine2 values have leading spaces,
  #     which the default whitespace trim removes. No key column is affected.
  mapping:
    - [Company, Company, string, varchar(10), source]
    - [DerivedNameID, DerivedNameID, string, varchar(255), source]
    - [InventoryLocation, InventoryLocation, string, varchar(50), source]
    - [Name, Name, string, varchar(255), source]
    - [PostalAddress, PostalAddress, string, varchar(500), source]
    - [PostalAddress.DisplayAddressLine1, AddressLine1, string, varchar(100), source]
    - [PostalAddress.DisplayAddressLine2, AddressLine2, string, varchar(100), source]
    - [PostalAddress.PostalCode, PostalCode, string, varchar(20), source]
    - [PostalAddress.Municipality, Municipality, string, varchar(50), source]
    - [PostalAddress.StateProvince, StateProvince, string, varchar(10), source]
    - [PostalAddress.County, County, string, varchar(50), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]
    # Load-date marker produced by the transform (today's date as 'YYYY-MM-DD');
    # tells consumers when this snapshot was last reloaded.
    - [ReportDate, ReportDate, date, date, computed]

  # Every source column is loaded; nothing extra ships in this export.
