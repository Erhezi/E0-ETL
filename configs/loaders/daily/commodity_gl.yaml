name: commodity_gl
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (CommodityCodeGL.csv refreshes alongside the other mdm exports).
tags: [daily, mdm, CommodityGL]

process:
  name: MDM Commodity GL
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: commodity_gl   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- each destination's single
# table is truncate+inserted in place (see vendor_item.yaml for the full pattern
# description). Replaces the manual notebook flow (INFOR table update.ipynb
# "Commodity GL"): read CommodityCodeGL.csv -> truncate MDM_COMMODITY_GL ->
# positional insert.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: MDM_COMMODITY_GL

  # infor-side copy. VERIFIED to exist with the identical 7 columns and the same
  # PK_commodity (CommodityCode) via table-info + sys.indexes on 2026-07-30. The
  # manual notebook only loaded des1; des2 is added here so this loader lands BOTH
  # destinations like the other mdm loaders (general_rules.md).
  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_COMMODITY_GL

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (commodity_gl).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. CommodityCodeGL_20260730.csv. <loader
# name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of the
# commodity-code -> GL issue-account table (8,781 rows in the 2026-07-07 sample),
# not a delta window, so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Drops the unused source ItemGroup
# column, stamps ReportDate with today's date, and fills string blanks with ''
# -- matching the manual notebook "Commodity GL" cell.
transforms:
  - commodity_gl

# Both destination tables key on PK_commodity (CommodityCode) and the export is
# one row per commodity code (0 duplicate keys in the 2026-07-07 sample). A
# duplicate would be an export defect that PK_commodity rejects mid-insert AFTER
# the truncate -- fail fast here, BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # No date/datetime *source* columns ship in this export (ReportDate is computed
  # by the commodity_gl transform, already ISO-formatted), so no
  # date_format/datetime_format is needed.

  # PK check runs after mapping/data conversion, so this is the destination column
  # name (matches PK_commodity on both destination tables).
  pk_check: [CommodityCode]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against PRIME.[DM_MONTYNT\dli2].MDM_COMMODITY_GL
  # and PLMPreprocessorShared.[infor].MDM_COMMODITY_GL via table-info on 2026-07-30;
  # the insert is by column name, so order is cosmetic (kept in table order). The
  # source ItemGroup column is dropped by the transform and not mapped here.
  mapping:
    - [CommodityCode, CommodityCode, string, varchar(20), source]
    - [CommodityCode_Level, CommodityCodeLevel, string, varchar(2), source]
    - [Description, Description, string, varchar(max), source]
    - [MMAHSIssueAccount, IssueAccount, string, varchar(20), source]
    - [MMAHSIssueAccount.GeneralLedgerChartAccount.AccountDescription, GLText, string, varchar(255), source]
    - [Active, Active, string, varchar(10), source]
    # Load-date marker produced by the commodity_gl transform (today's date as
    # 'YYYY-MM-DD'); tells consumers when this snapshot was last reloaded.
    - [ReportDate, ReportDate, date, date, computed]
