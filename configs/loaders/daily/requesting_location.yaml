name: requesting_location
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (requesting+location.csv refreshes alongside the other mdm
# exports).
tags: [daily, mdm, RequestingLocation]

process:
  name: MDM Requesting Location
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: requesting_location   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- each destination's single
# table is truncate+inserted in place (see mdm_vendor_item.yaml for the full
# pattern description). Replaces the manual notebook flow (INFOR table
# update.ipynb "Requesting Location"): read requesting+location.csv -> select
# columns -> truncate MDM_REQUESTING_LOCATION -> positional insert.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: MDM_REQUESTING_LOCATION

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_REQUESTING_LOCATION

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (requesting_location).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. requesting+location_20260727.csv.
# <loader name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of all
# requesting locations (11,361 rows in the 2026-07-27 sample), not a delta
# window, so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Stamps ReportDate with today's date;
# column selection, source->destination renaming, and datetime typing of the two
# stamps are handled by the mapping below.
transforms:
  - requesting_location

# Both destination tables key on (Company, RequestingLocation) and the export is
# one row per key (0 duplicate keys, no whitespace padding in the 2026-07-27
# sample). A duplicate would be an export defect -- fail here, BEFORE the
# truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # strptime format for `datetime`-typed source columns, e.g. 09/22/2022 11:44:31 AM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column
  # names.
  pk_check: [Company, RequestingLocation]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # NOTE: several destination names differ from the source names (DerivedFDn,
  # AddressLine1/2) -- the notebook's positional insert hid this; the mapping
  # renames by name. Destination names/types VERIFIED against
  # PRIME.[DM_MONTYNT\dli2].MDM_REQUESTING_LOCATION and
  # PLMPreprocessorShared.[infor].MDM_REQUESTING_LOCATION via table-info on 2026-07-27.
  mapping:
    - [Company, Company, string, varchar(10), source]
    - [RequestingLocation, RequestingLocation, string, varchar(40), source]
    - [Active, Active, string, varchar(5), source]
    - [DerivedFinanceDimension1, DerivedFD1, string, varchar(255), source]
    - [DerivedFinanceDimension3, DerivedFD3, string, varchar(255), source]
    - [DerivedFinanceDimension5, DerivedFD5, string, varchar(255), source]
    - [DerivedProject, DerivedProject, string, varchar(255), source]
    - [FillOrKill, FillOrKill, string, varchar(10), source]
    - [LocationRule, LocationRule, string, varchar(20), source]
    - [DerivedFromLocation, DerivedFromLocation, string, varchar(255), source]
    - [FromCompanyLocation, FromCompanyLocation, string, varchar(30), source]
    - [PostalAddress, PostalAddress, string, varchar(255), source]
    - [PostalAddress.DisplayAddressLine1, AddressLine1, string, varchar(100), source]
    - [PostalAddress.DisplayAddressLine2, AddressLine2, string, varchar(100), source]
    - [Name, Name, string, varchar(255), source]
    - [RequisitionApprovalType, RequisitionApprovalType, string, varchar(100), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]
    # Load-date marker produced by the requesting_location transform (today's
    # date as 'YYYY-MM-DD'); tells consumers when this snapshot was last reloaded.
    - [ReportDate, ReportDate, date, date, computed]

  # Present in the source file but not loaded (the manual notebook dropped it
  # too). Optional: a missing one only warns, since it cannot affect the output.
  extra:
    - ActiveRequestingLocations
