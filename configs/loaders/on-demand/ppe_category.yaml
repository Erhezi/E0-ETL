name: ppe_category
enabled: true
# ON-DEMAND ONLY. One of four PPE loaders (ppe_category / ppe_item / ppe_parloc /
# ppe_facility), each reading its own sheet of the hand-maintained PPE master
# workbook (see configs\file_folder_loader_config.yaml -> ppe_master). The
# 'on-demand' tag keeps this loader OUT of the daily --all batch (and the
# move-files --check scan) -- run it explicitly after the workbook is updated:
#   python -B run_daily_loaders.py --loader ppe_category
# 'ppe' groups the four together (--tag ppe); 'PPECategory' is the self-select tag.
tags: [on-demand, ppe, PPECategory]

process:
  name: PPE Category
  frequency: On Demand

source:
  multiple_input_files: false
  files:
    - alias: main
      input: ppe_master   # path + filename (a glob): see configs\file_folder_loader_config.yaml
      reader: excel
      # The workbook name carries a manually-bumped timestamp suffix, so ppe_master's
      # `name` is a glob; pick the newest match if more than one is ever present.
      pick_latest: true
      options:
        # This loader reads only the PPE_CATEGORY sheet; row 1 is the real header
        # (no banner row, unlike the GHX export). dtype=str keeps everything as
        # text; typing/blank-filling happen in the mapping below.
        sheet_name: PPE_CATEGORY
        dtype: str

# DIRECT LOAD on two servers: PPE reference data has no staging table -- each
# destination's single table is truncate+inserted in place (same pattern as the
# mdm direct loaders, e.g. daily\item.yaml). des1 lives in PRIME; des2 is the
# infor-side copy in the dedicated PPE database, schema ppe. Both tables VERIFIED
# to have the identical 5 columns and PK_PPECat on (NewPPEClass) via table-info /
# sys.indexes on 2026-08-06.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: PPE_CATEGORY

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PPE
    schema: ppe
    table: PPE_CATEGORY

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (ppe_category).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# Archiving OFF: the PPE master workbook is a hand-maintained FIXTURE that stays
# in custom_made (its name suffix is bumped in place before each edit), so there
# is nothing to relocate/stamp after a load -- the workbook itself is the record.
archive:
  enabled: false

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. Each sheet is a full point-in-time snapshot of the
# PPE reference data (not a rolling delta window), so there is no gap to guard.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# PK_PPECat is on (NewPPEClass) on both destination tables and the sheet is one
# row per class (0 duplicate keys in the 2026-08-06 sample). A duplicate would be
# an authoring defect -- fail here, BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # LastUpdateDate ships as an ISO datetime with a 00:00:00 time component (e.g.
  # 2026-06-01 00:00:00) but lands in a DATE column; per general_rules it is typed
  # `datetime` (destination_type date) so the loader truncates it client-side.
  datetime_format: '%Y-%m-%d %H:%M:%S'

  # PK check runs after mapping/data conversion, so this is the destination column
  # name (matches PK_PPECat on both destination tables).
  pk_check: [NewPPEClass]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source = a required column read from the sheet (hard-fail if missing)
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against PRIME.[DM_MONTYNT\dli2].PPE_CATEGORY
  # and PPE.[ppe].PPE_CATEGORY on 2026-08-06.
  mapping:
    - [NewPPEClass, NewPPEClass, string, varchar(40), source]
    - [AcuteMultiplier, AcuteMultiplier, float, "numeric(19, 4)", source]
    - [LTCMultiplier, LTCMultiplier, float, "numeric(19, 4)", source]
    - [Estimator, Estimator, float, "numeric(19, 4)", source]
    - [LastUpdateDate, LastUpdateDate, datetime, date, source]
