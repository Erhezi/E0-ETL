name: par_item_bin
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in
# the misc mdm folder (Par+Items+DL.csv refreshes alongside the other mdm
# exports).
tags: [daily, mdm, ParItemBin]

process:
  name: MDM Par Item Bin
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: par_item_bin   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- each destination's single
# table is truncate+inserted in place (see mdm_vendor_item.yaml for the full
# pattern description). Replaces the manual notebook flow (INFOR table
# update.ipynb "Par Items"): read Par+Items+DL.csv -> truncate PLM.ParItemBin
# -> positional insert. NOTE: des1 lands in PRIME's [PLM] schema, not
# [DM_MONTYNT\dli2] -- that is where the notebook always loaded it.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: PLM
    table: ParItemBin

  # Landing copy in the PLM DATABASE on the shared server. The prepped,
  # currently-empty table there lives in schema [PLM] (no [infor].ParItemBin
  # exists in that database) -- VERIFIED identical 13 columns and the same PK
  # on 2026-07-23.
  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLM
    schema: infor
    table: ParItemBin

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (par_item_bin).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. Par+Items+DL_20260723.csv. <loader
# name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of all
# par item bins (5,823 rows in the 2026-07-23 sample), not a delta window, so
# there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# No transforms: nothing is computed. Int/float/datetime typing comes from the
# mapping, string blanks are filled by normalize_for_db, numeric blanks stay
# NULL (general_rules.md).

# Both destination tables have PK_parItemBin on (Location, BinSequence) -- a
# bin sequence number is unique within its par location. The export is one row
# per key (0 duplicate keys, no whitespace padding in the 2026-07-23 sample).
# A duplicate would be an export defect -- fail here, BEFORE the
# truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # strptime format for `datetime`-typed source columns, e.g. 10/21/2023 09:34:05 PM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column
  # names (matches PK_parItemBin on both destination tables).
  pk_check: [Location, BinSequence]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against PRIME.[PLM].ParItemBin and
  # PLM.[PLM].ParItemBin on 2026-07-23. Every source column is loaded; note the
  # renames, which the manual notebook loads handled positionally.
  mapping:
    - [Company, Company, string, varchar(10), source]
    - [InventoryLocation.LocationType, LocationType, string, varchar(20), source]
    - [InventoryLocation, Location, string, varchar(20), source]
    - [InventoryLocation.Name, LocationText, string, varchar(150), source]
    - [Item, Item, string, varchar(10), source]
    - [Item.Description, ItemDescription, string, varchar(500), source]
    - [DefaultTransactionUOM.UnitOfMeasure, DefaultTransactionUOM, string, varchar(5), source]
    # Ships with thousands separators (e.g. "144.0000000"); the standard float
    # conversion strips them.
    - [DefaultTransactionUOM.UOMConversion, DefaultTransactionUOMMultiplier, float, "numeric(18, 4)", source]
    # Never blank in the export; NOT NULL int in both destinations, so a blank
    # would fail the insert loudly -- intentional.
    - [BinSequence, BinSequence, int, int, source]
    - [TransientShelfLocation, TransientShelfLocation, string, varchar(50), source]
    - [PreferredBin, PreferredBin, string, varchar(50), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]

  # Every source column is loaded; nothing extra ships in this export.
