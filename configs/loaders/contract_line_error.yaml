name: contract_line_error
enabled: true
# 'Preprocessor' groups the loaders that feed the App Preprocessor (run them together
# with --tag Preprocessor); see also vendor_location and item_replenish_from.
tags: [daily, operational, Preprocessor, ContractLineError]

process:
  name: Contract Line Error
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: contract_line_error   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# STAGING-ONLY loader (NOT a direct load). Unlike a master-data direct loader (one
# table truncated in place), contract-line-error is a staging->prod TRANSACTION
# pipeline: the file lands in a _stg table, then a MERGE promotes it into the prod
# InforContractLineError table, stamping each error row New / Persisting / Resolved.
#
# This loader OWNS the file->staging load only -- it replaces the manual notebook
# "ContractLineError" cell (read ContractLineError.csv -> truncate the _stg table ->
# insert). The staging->prod promotion is deliberately NOT run here: it is steps 20-21
# of the scheduled orchestrator [Preprocessor].usp_RunPreprocessor_Batch
# (EXEC sp_UpdateContractLineErrors, then EXEC sp_InsertInforContractLineErrorStat for
# the daily error-count snapshot). Those two must stay together, so bundling only the
# promote into this loader would desync the stat snapshot -- hence prod.post_sql is left
# unset. With no prod.post_sql the framework loads staging and skips promotion, while the
# prod: blocks still mark this as a transactional (not direct) loader and document the
# promote target (see general_rules.md).
#
# Object names VERIFIED via table-info on 2026-07-31 (all staging tables carry the same
# 22 columns as the export; the two prod tables add ErrorStatus + LastUpdate = 24):
#   des1 staging  PRIME.[Preprocessor].InforContractLineError_stg
#   des1 prod     PRIME.[Preprocessor].InforContractLineError
#   des2 staging  Preprocessor.[infor].contractlineerror_stg
#   des2 prod     Preprocessor.[infor].ContractLineError
# The des1 promotion proc [Preprocessor].sp_UpdateContractLineErrors EXISTS; the infor
# schema on the Preprocessor DB has NO promotion proc yet (migration in progress), so
# des2's prod table is populated only once that proc + a batch step are added there.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: Preprocessor
    staging:
      table: InforContractLineError_stg
    prod:
      # Promotion runs via [Preprocessor].sp_UpdateContractLineErrors inside
      # usp_RunPreprocessor_Batch -- not by this loader (no prod.post_sql).
      table: InforContractLineError

  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: Preprocessor
    schema: infor
    staging:
      table: contractlineerror_stg
    prod:
      # Preprocessor-DB copy. No infor-schema promotion proc/batch exists here yet
      # (2026-07-31), so for now this loader only populates the staging table on des2.
      table: ContractLineError

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (contract_line_error).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. ContractLineError_20260731.csv. <loader
# name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

stg_load:
  strategy: truncate_insert   # how each staging table is loaded from the source file
  batch_size: 50000

# How prod is promoted from the just-loaded staging table. DECLARATIVE ONLY: the real
# promotion is a New/Persisting/Resolved MERGE on the natural key run by
# [Preprocessor].sp_UpdateContractLineErrors, scheduled inside usp_RunPreprocessor_Batch
# -- this loader does not run it (no prod.post_sql). Recorded here to document the pipeline.
prd_load:
  strategy: pk_merge

# Delta-overlap guard: skip. The ContractLineError export is a full point-in-time
# snapshot of the currently-open contract line errors (224 rows in the 2026-07-28
# sample), not a rolling delta window, so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

use_db_column_order: false

# No transform: the export is a 1:1 column match to the staging tables, and every
# conversion the manual notebook did inline is handled centrally by the mapping pipeline
# below -- ErrorMessageNumber/ContractLineError -> int, create/update stamp -> datetime
# (apply_type_changes), ContractLine.UOM trim + string blanks -> '' (normalize_for_db).
# The notebook truncated ContractLine.UOMConversion to int(); we keep the destination's
# numeric(19, 4) precision instead (matching contract_line's DerivedUOMConversion). The
# legacy contract_line_error transform in transforms.py is therefore intentionally unused.

# Natural key (Contract, ContractLine, ErrorMessageNumber) -- the key
# sp_UpdateContractLineErrors MERGEs on; a duplicate would make that MERGE fail
# ("cannot update the same row twice"), so fail fast here. 0 duplicate keys in the
# 2026-07-28 sample. (ContractLineError is a non-unique surrogate id -- 5 dup ids in
# the sample -- so it is NOT the key.)
fail_on_pk_duplicates: true

field_config:
  # strptime format for `datetime`-typed source columns, e.g. 07/22/2026 10:44:21 AM.
  # Set explicitly so pandas parses fast and unambiguously instead of guessing per row.
  datetime_format: '%m/%d/%Y %I:%M:%S %p'

  # PK check runs after mapping/data conversion, so these are destination column names.
  pk_check: [Contract, ContractLine, ErrorMessageNumber]

  # Loaded columns, ordered like the staging tables (ordinal position). Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source = a required column read from the source file (hard-fail if missing)
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against both staging tables via table-info on
  # 2026-07-31; each source column name is identical to its destination name (1:1 load).
  mapping:
    - [ContractGroup, ContractGroup, string, varchar(2), source]
    - [Contract, Contract, string, varchar(10), source]
    - [Contract.Description, Contract.Description, string, varchar(255), source]
    - [ContractLine, ContractLine, string, varchar(20), source]
    - [ContractLineError, ContractLineError, int, int, source]
    - [ContractLine.UOM, ContractLine.UOM, string, varchar(10), source]
    - [ContractLine.UOMConversion, ContractLine.UOMConversion, float, "numeric(19, 4)", source]
    - [ContractLine.Vendor, ContractLine.Vendor, string, varchar(10), source]
    - [ContractLine.VendorItem, ContractLine.VendorItem, string, varchar(100), source]
    - [ContractLine.Manufacturer, ContractLine.Manufacturer, string, varchar(10), source]
    - [ContractLine.ManufacturerNumber, ContractLine.ManufacturerNumber, string, varchar(100), source]
    - [ContractLine.ItemType, ContractLine.ItemType, string, varchar(20), source]
    - [ContractLine.ItemNumber, ContractLine.ItemNumber, string, varchar(100), source]
    - [ErrorContract, ErrorContract, string, varchar(10), source]
    - [ErrorContractLine, ErrorContractLine, string, varchar(20), source]
    - [ErrorCode1, ErrorCode1, string, varchar(20), source]
    - [ErrorItem, ErrorItem, string, varchar(100), source]
    - [ErrorVendorItem, ErrorVendorItem, string, varchar(100), source]
    - [ErrorMessageNumber, ErrorMessageNumber, int, int, source]
    - [ErrorMessageDisplay, ErrorMessageDisplay, string, varchar(500), source]
    - [create stamp, create stamp, datetime, datetime, source]
    - [update stamp, update stamp, datetime, datetime, source]
