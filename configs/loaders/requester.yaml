name: requester
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (copy+of+requester.csv refreshes alongside the other mdm exports).
tags: [daily, mdm, Requester]

process:
  name: MDM Requester
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: requester   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- each destination's single
# table is truncate+inserted in place (see vendor_item.yaml for the full pattern
# description). Replaces the manual notebook flow (INFOR table update.ipynb
# "Requester"): read copy+of+requester.csv -> truncate MDM_REQUESTER ->
# positional insert.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: MDM_REQUESTER

  # infor-side copy. VERIFIED to exist with the identical 8 columns and the same
  # PK_requester (Requester) via table-info + sys.indexes on 2026-07-30. The
  # manual notebook only loaded des1; des2 is added here so this loader lands BOTH
  # destinations like the other mdm loaders (general_rules.md).
  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_REQUESTER

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (requester).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. copy+of+requester_20260730.csv. <loader
# name> is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of all
# requesters (3,370 rows in the 2026-07-07 sample), not a delta window, so there
# is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Drops the unused source Reference1/
# Reference2 columns, stamps ReportDate with today's date, and fills string
# blanks with '' -- matching the manual notebook "Requester" cells.
transforms:
  - requester

# Both destination tables key on PK_requester (Requester) and the export is one
# row per requester (0 duplicate keys in the 2026-07-07 sample). A duplicate would
# be an export defect that PK_requester rejects mid-insert AFTER the truncate --
# fail fast here, BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # No date/datetime *source* columns ship in this export (ReportDate is computed
  # by the requester transform, already ISO-formatted), so no
  # date_format/datetime_format is needed.

  # PK check runs after mapping/data conversion, so this is the destination column
  # name (matches PK_requester on both destination tables).
  pk_check: [Requester]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against PRIME.[DM_MONTYNT\dli2].MDM_REQUESTER
  # and PLMPreprocessorShared.[infor].MDM_REQUESTER via table-info on 2026-07-30;
  # the insert is by column name, so order is cosmetic (kept in table order). The
  # source Reference1/Reference2 columns are dropped by the transform, not mapped.
  # RequesterName is NOT NULL on both tables; the 12 blank names in the sample land
  # as '' (a valid non-null value), exactly as the notebook's fillna('') did.
  mapping:
    - [Requester, Requester, string, varchar(20), source]
    - [Requester.Employee.PresentationNameSnapshot, RequesterName, string, varchar(250), source]
    - [RequestingLocation, RequestingLocation, string, varchar(50), source]
    - [OverrideContractCost, OverrideContractCost, string, varchar(10), source]
    - [OverrideLastPOLastCost, OverrideLastPOLastCost, string, varchar(10), source]
    - [ManualOverrideAllowed, ManualOverrideAllowed, string, varchar(10), source]
    - [EmailAddress, EmailAddress, string, varchar(450), source]
    # Load-date marker produced by the requester transform (today's date as
    # 'YYYY-MM-DD'); tells consumers when this snapshot was last reloaded.
    - [ReportDate, ReportDate, date, date, computed]
