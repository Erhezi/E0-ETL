name: edi_sub_uom
enabled: true
# 'daily' opts this loader into the scheduled workday run; 'mdm' additionally
# lets it be rerun on demand (--tag mdm) after a fresh Infor export lands in the
# misc mdm folder (EDI+sub.csv refreshes alongside the other mdm exports).
tags: [daily, mdm, EDISubUOM]

process:
  name: MDM EDI Sub UOM
  frequency: Workdays

source:
  multiple_input_files: false
  files:
    - alias: main
      input: edi_sub_uom   # path + filename: see configs\file_folder_loader_config.yaml
      reader: csv
      options:
        dtype: str

# DIRECT LOAD: master data has no staging table -- each destination's single
# table is truncate+inserted in place (see vendor_item.yaml for the full pattern
# description). Replaces the manual notebook flow (INFOR table update.ipynb
# "EDI SUB"): read EDI+sub.csv -> truncate MDM_EDI_SUB_UOM -> positional insert.
destinations:
  - name: des1
    enabled: true
    server: MISCPrdAdhocDB
    database: PRIME
    schema: 'DM_MONTYNT\dli2'
    table: MDM_EDI_SUB_UOM

  # infor-side copy. VERIFIED to exist with the identical 4 columns and the same
  # PK_uom (table-info + sys.indexes on 2026-07-29). The manual notebook only
  # loaded des1; des2 is added here so this loader lands BOTH destinations like
  # the other mdm loaders (general_rules.md).
  - name: des2
    enabled: true
    server: YNBBSTVWP02\PROCDATASRVPROD
    database: PLMPreprocessorShared
    schema: infor
    table: MDM_EDI_SUB_UOM

health_table:
  server: 'YNBBSTVWP02\PROCDATASRVPROD'
  database: SCSFileIngestor
  schema: InforLoader
  table: ETLHealth

logging:
  # <loader name> is substituted with this loader's name (edi_sub_uom).
  log_root: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\logs'
  level: INFO
  console: true          # echo run logs to the console (stderr) for Task Scheduler output
  capture_streams: true  # capture stdout/stderr (prints, warnings, tracebacks) into the log file

# After a successful load the source file is copied here with a _YYYYMMDD stamp
# appended (original extension kept), e.g. EDI+sub_20260729.csv. <loader name>
# is substituted with this loader's name. Set enabled: false to skip.
archive:
  path: '\\montefiore.org\centralfiles\data\Procurement PMO\dli2\DailyLoader\<loader name>\archived'

# direct_load: the final table is loaded in place (no staging step). Column
# validation and pk_check run first, then TRUNCATE, then the batched insert --
# a hard failure aborts before the table is touched.
direct_load:
  strategy: truncate_insert
  batch_size: 50000

# Delta-overlap guard: skip. The export is a full point-in-time snapshot of the
# EDI UOM substitution table (31 rows in the 2026-07-29 sample), not a delta
# window, so there is no gap between runs to guard against.
validation:
  overlap_check:
    mode: skip
    source_column: null
    db_column: null
    baseline: prod                  # which already-in-DB table to read MAX from: prod | staging
    skip_if_db_empty: true          # first-ever load has nothing to overlap -> skip instead of fail

# Registered in infor_loader/transforms.py. Stamps ReportDate with today's date
# (-> LastUpdateDate), fills blanks with the 'NA' sentinel, and stringifies every
# column -- matching the manual notebook "EDI SUB" cell and the rows already in
# prod. The 'NA' fill is a DELIBERATE deviation from the '' string-blank
# convention (general_rules.md): a blank ExternalValue must land as a non-null
# value because the column is NOT NULL AND part of PK_uom (see pk_check below),
# and prod already stores that row as 'NA' from the notebook loads.
transforms:
  - edi_sub

# Both destination tables key on PK_uom (LawsonValue, ExternalValue) and the
# export is one row per key (0 duplicate keys in the 2026-07-29 sample, after the
# single blank ExternalValue is filled to 'NA'). A duplicate would be an export
# defect that PK_uom rejects mid-insert AFTER the truncate -- fail fast here,
# BEFORE the truncate+insert touches the table.
fail_on_pk_duplicates: true

field_config:
  # No date/datetime *source* columns ship in this export (LastUpdateDate is
  # computed by the edi_sub transform, already ISO-formatted), so no
  # date_format/datetime_format is needed.

  # PK check runs after mapping/data conversion, so these are destination column
  # names (matches PK_uom on both destination tables). ExternalValue is included
  # because the PK is composite; its lone blank is already 'NA' by this point.
  pk_check: [LawsonValue, ExternalValue]

  # Loaded columns, ordered like the destination table. Row format:
  #   [source_or_computed, destination, type_to_convert_to_in_python, destination_datatype, origin]
  # origin: source   = a required column read from the source file (hard-fail if missing)
  #         computed = produced by a transform/loader, not present in the file
  # type: string | date | datetime | float | int
  # Destination names/types VERIFIED against PRIME.[DM_MONTYNT\dli2].MDM_EDI_SUB_UOM
  # and PLMPreprocessorShared.[infor].MDM_EDI_SUB_UOM via table-info on 2026-07-29.
  # All three source columns are prefixed 'EDIDataSubstitutionTable.' and rename to
  # the bare destination names (note EdilistName -> EDIListName); the manual
  # notebook's positional insert hid these renames.
  mapping:
    - [EDIDataSubstitutionTable.EdilistName, EDIListName, string, varchar(100), source]
    - [EDIDataSubstitutionTable.LawsonValue, LawsonValue, string, varchar(10), source]
    - [EDIDataSubstitutionTable.ExternalValue, ExternalValue, string, varchar(10), source]
    # Load-date marker produced by the edi_sub transform (today's date as
    # 'YYYY-MM-DD'); tells consumers when this snapshot was last reloaded.
    - [ReportDate, LastUpdateDate, date, date, computed]

  # Every source column is loaded; nothing extra ships in this export.
